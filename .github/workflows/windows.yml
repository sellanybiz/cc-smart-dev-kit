name: Windows

# The plugin's hooks on native Windows. Claude Code gives a shell-form hook to Git Bash there
# (it cannot spawn a script itself), and Git Bash is a POSIX shell, so the hooks must be
# shaped for it: docs/windows-hooks.md says how, and docs/claude-code-contract.md says which
# of it is proved here and which still needs one run on a person's Windows PC.
#
# This job is deliberately small: the tests that are cross-platform today — the hooks', the
# session names and the `claude` launch argv, the guards' Windows paths (a `C:\…` path, the PowerShell dialect), the
# background clean's Windows argv and the detached start's trampoline, the shell reader, and the
# readers whose rule is "is this file the owner's alone?" (`isOwnerOnly`: on Windows the mode
# says nothing and the profile's ACL is the protection) — and the smoke test that runs a real
# hook bundle through the real shim in Git Bash. Everything else in the suite is Linux-only for
# now — it spawns `/bin/sh`, reads `/proc`, fakes `notify-send`, or fakes a bun with a shell
# script (Windows cannot run one as bun.exe) — and runs in the Linux job. As each part of the
# plugin becomes Windows-shaped, add its tests here; nothing is skipped silently: a POSIX-only
# assertion is marked `skipIf(NO_POSIX_MODES)` in the file, next to the Windows case.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # MIN_BUN in src/build-info/bun.ts: the oldest Bun cc-smart-dev-kit runs on. A test keeps them equal.
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: The hooks' own tests
        # `shell: bash` on purpose: Git Bash is where the plugin's hooks run on Windows, and
        # this is the shell the tests must be started from. The file checks hooks.json's form
        # and quoting, and runs every hook bundle as Claude Code runs it.
        shell: bash
        run: bun test src/hooks/entries.test.ts

      - name: The tests of the readers that ask whether a file is the owner's alone
        # The token file, the gateway's config (the router's own reader), the Tavily key file and
        # the browser's output folder — and the helper every one of them asks
        # (`src/setup/file-mode.ts`).
        # On Windows `statSync().mode` is 0666 for a writable file whatever its ACL says, so
        # these readers trust the profile's ACL and never refuse a file over its bits: each file
        # here has a Windows case (a 0o666 file is read) and a POSIX case (a 0o644 file is still
        # refused, in the Linux job too). No `shell: bash`: these are the plugin's own tests,
        # started from the shell a person has on Windows.
        run: >
          bun test
          src/setup/file-mode.test.ts
          src/browser/token.test.ts
          src/machine/private-dir.test.ts
          src/mcp/mcp.test.ts
          src/gateway/gateway.test.ts

      - name: The router's task definition, read by Task Scheduler itself
        # The gateway's other tests use a fake Task Scheduler, which never parses the XML: a
        # declaration naming UTF-8 passed them all and failed every real registration ("unable
        # to switch the encoding"). This file hands the definition to Task Scheduler's own
        # parser, as `Register-ScheduledTask -Xml` does, and registers nothing.
        run: bun test src/gateway/service-windows.test.ts

      - name: The 1.0.0 parts on Windows — the claude argv, the guards' Windows paths, the clean
        # What this step proves, file by file:
        # - the `claude.exe`/`claude.cmd` argv the kit runs `claude` with: a `.cmd` runs
        #   through `cmd.exe`; and a session's name holds on every platform;
        # - the always-on guards' Windows paths: a `C:\…` state path asks, and the Bash judge
        #   reads the PowerShell tool's dialect (the PowerShell cases run here natively);
        # - the background clean's argv behind the `cmd /c start` trampoline, and the detached
        #   start itself (a program that outlives the call, on the platform the trampoline is
        #   for) — the POSIX-only assertions beside them are `skipIf(NO_POSIX_MODES)`;
        # - the one shell reader the guards share, its PowerShell dialect included.
        # No `shell: bash`: the plugin's own tests, from the shell a person has on Windows.
        run: >
          bun test
          src/hooks/session-name.test.ts
          src/machine/claude.test.ts
          src/hooks/session-escape-guard.test.ts
          src/hooks/agent-guard.test.ts
          src/hooks/bash-judge.test.ts
          src/hooks/job-route.test.ts
          src/hooks/detached.test.ts
          src/shell/command.test.ts
          src/worktrees/auto-clean.test.ts

      - name: install.ps1 in a fake world (pwsh)
        # The one-command installer, on the shell a Windows person runs it with: the test
        # starts install.ps1 as its own process, with a temp HOME and fakes for `claude`,
        # `bun`, `gh` and git (the same shape scripts/install.test.ts proves install.sh with).
        # Nothing here reaches the network, a real Claude Code, or the person's own profile.
        run: pwsh -NoProfile -File scripts/install-windows-smoke.ps1

      - name: install.ps1 in a fake world (Windows PowerShell 5.1)
        # The same cases under the PowerShell a Windows machine ships: install.ps1 must work
        # on 5.1 too, and this is the only place that proves it.
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install-windows-smoke.ps1

      - name: A hook bundle runs through the shim in Git Bash
        # The whole hook path on Windows, with no person: Git Bash runs the shim, the shim
        # finds bun.exe, the bundle answers the hook input, and — with bun taken away — the
        # guard still fails closed. It also proves `--missing=fail` (the command's mode: one
        # line and exit 1) and the exact line `cc-smart-dev-kit hook` writes, through `$HOME`
        # and Git Bash.
        shell: bash
        run: bash scripts/windows-hook-smoke.sh
