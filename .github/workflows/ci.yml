name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the version check can find where the PR left its base.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          # MIN_BUN in src/build-info/bun.ts: the oldest Bun cc-smart-dev-kit runs on. A test keeps them equal.
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: A plugin change raises the version
        # Claude Code updates a plugin only when its version changes.
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bun scripts/check-version-bump.ts "origin/$BASE_REF"

      - name: Type check
        run: bun run typecheck

      - name: Lint and format check
        run: bun run lint

      - name: Neutral (no file names the publisher)
        run: bun run check:neutral

      - name: One home per rule (no sentence repeats across the plugin's instructions)
        run: bun run check:duplicates

      - name: The general instructions stay inside their line budget
        run: bun run check:core-lines

      - name: Tests
        run: bun test

      - name: Bundles are up to date
        run: bun run build:check

      - name: Install the portal's dependencies
        # `portal/` is its own package, with its own lockfile: React and Next never reach a
        # machine (the export is static files), so the kit's own install does not carry them.
        working-directory: portal
        run: bun install --frozen-lockfile

      - name: Type check the portal
        working-directory: portal
        run: bun run typecheck

      - name: The portal's tests
        working-directory: portal
        run: bun run test

      - name: The portal's export ships in the plugin, and is up to date
        # Builds the Next export and compares it byte for byte with plugin/portal-ui. A stale
        # export means the page a machine serves is not the one this code draws; the build is
        # reproducible (generateBuildId in portal/next.config.ts), so the compare is exact.
        run: bun run check:portal

      - name: Install the tested Claude Code
        # The tested version is .claude-code-version at the repo root: raise it on purpose.
        # In its own folder, so it never touches this repo's package.json or lockfile.
        # --trust lets its postinstall fetch the native binary.
        run: |
          CLAUDE_CODE_VERSION="$(cat .claude-code-version)"
          mkdir -p "$RUNNER_TEMP/claude-code"
          cd "$RUNNER_TEMP/claude-code"
          echo '{"name":"claude-code-ci","private":true}' > package.json
          bun add --trust "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          echo "$RUNNER_TEMP/claude-code/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Validate the plugin
        run: |
          claude --version
          claude plugin validate plugin --strict

      - name: Validate the marketplace
        run: claude plugin validate . --strict

      - name: Context budget
        # Needs Claude Code: it reads `claude plugin details` for the copy in plugin/.
        run: bun run check:context-budget
