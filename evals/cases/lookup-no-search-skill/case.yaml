schema_version: "1.1"
name: lookup-no-search-skill
description: >-
  "Look up" fires the search skill, which needs the optional gateway; no gateway is set up in an
  eval run. Finding: IN-22.
tags: [gate, no-trigger]
plugins: ["../../.under-test/plugin", "../../harness"]
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: |
    Look up the latest stable version of the zod package on npm.
graders:
  - name: no-search
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?search"'
    min: 0
    max: 0
    arm: 'both'
