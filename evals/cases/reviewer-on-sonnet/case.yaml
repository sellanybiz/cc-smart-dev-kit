schema_version: "1.1"
name: reviewer-on-sonnet
description: >-
  A docs change set that also edits a rule file: instruction files are never a small fix, so the
  one second opinion is due, but nothing in it is security, money, permissions, a schema, deploy
  plumbing, the gateway's router or a release. The reviewer runs on sonnet, not on opus (the
  owner's decision D46).
tags: [watch, delegation, needs-shell]
plugins: ["../../under-test/plugin", "../../harness"]
execution:
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Agent]
  prompt: |
    I rewrote the README's install section and tightened the docs-style rule in .claude/rules/docs-style.md. Get the second opinion on this change set before I commit it.
context:
  scaffold_script: scaffold.sh
graders:
  - name: launches-the-reviewer
    type: tool_used
    tool: 'Agent'
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?reviewer"'
  - name: reviewer-on-sonnet
    type: tool_used
    tool: 'Agent'
    input_match: '(?=[\s\S]*"subagent_type"\s*:\s*"(?:[\w-]+:)?reviewer")(?=[\s\S]*"model"\s*:\s*"sonnet")'
  - name: no-opus-agent
    type: tool_used
    tool: 'Agent'
    input_match: '"model"\s*:\s*"opus"'
    min: 0
    max: 0
    arm: 'both'
