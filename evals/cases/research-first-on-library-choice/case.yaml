schema_version: "1.1"
name: research-first-on-library-choice
description: >-
  Choosing between two libraries is research-first's job.
tags: [watch, trigger, research]
plugins: ["../../.under-test/plugin", "../../harness"]
execution:
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Should this project use date-fns or Day.js for time-zone handling? Recommend one.
context:
  scaffold_script: scaffold.sh
graders:
  - name: fires-research-first
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?research-first"'
