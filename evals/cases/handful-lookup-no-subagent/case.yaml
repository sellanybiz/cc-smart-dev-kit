schema_version: "1.1"
name: handful-lookup-no-subagent
description: >-
  A lookup over four small files is a handful of tool calls: it should not be delegated. Today's
  core.md says to delegate reading more than three files. Finding: IN-1.
tags: [gate, delegation]
plugins: ["../../.under-test/plugin", "../../harness"]
execution:
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  prompt: |
    Which file in src/ exports a function named parseDate? Answer with its path.
context:
  scaffold_script: scaffold.sh
graders:
  - name: no-agent-call
    type: tool_used
    tool: 'Agent'
    min: 0
    max: 0
    arm: 'both'
  - name: no-task-call
    type: tool_used
    tool: 'Task'
    min: 0
    max: 0
    arm: 'both'
  - name: right-file
    type: regex
    pattern: 'src/dates\.ts'
