schema_version: "1.1"
name: answers-which-model
description: >-
  Today's core.md forbids any comment on the session's model, so a plain question goes
  unanswered. Finding: IN-3.
tags: [gate]
plugins: ["../../.under-test/plugin", "../../harness"]
execution:
  max_turns: 3
  allowed_tools: [Skill]
  prompt: |
    Which model are you running on right now?
graders:
  - name: names-a-model
    type: regex
    pattern: 'haiku|sonnet|opus|fable|claude-[a-z0-9-]+'
    flags: 'i'
  - name: no-gateway
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gateway"'
    min: 0
    max: 0
    arm: 'both'
