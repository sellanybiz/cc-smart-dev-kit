schema_version: "1.1"
name: audit-on-a-sweep
description: >-
  A project with a small hook folder, and an ask to audit it for one class of defect: the audit
  skill fires, because this is a sweep of an area and not a diff. The audit reads and reports;
  it edits nothing before the person says to fix what it found.
tags: [watch]
plugins: ["../../.under-test/plugin", "../../harness"]
execution:
  max_turns: 16
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Agent]
  prompt: |
    Audit the error handling under src/hooks for swallowed errors. Keep it short - two or three
    files.
context:
  scaffold_script: scaffold.sh
graders:
  - name: fires-audit
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?audit"'
  - name: no-edit-before-the-ask
    type: tool_used
    tool: 'Edit'
    input_match: '"file_path"\s*:\s*"[^"]*/src/'
    min: 0
    max: 0
    arm: 'both'
  - name: no-write-before-the-ask
    type: tool_used
    tool: 'Write'
    input_match: '"file_path"\s*:\s*"[^"]*/src/'
    min: 0
    max: 0
    arm: 'both'
