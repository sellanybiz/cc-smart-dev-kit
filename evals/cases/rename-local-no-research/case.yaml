schema_version: "1.1"
name: rename-local-no-research
description: >-
  A rename inside one function needs no research, no plan and no subagent. Finding: IN-11,
  IN-12.
tags: [gate, no-trigger]
plugins: ["../../.under-test/plugin", "../../harness"]
execution:
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Agent]
  prompt: |
    Rename the variable x to count in src/counter.js.
context:
  scaffold_script: scaffold.sh
graders:
  - name: no-research-first
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?research-first"'
    min: 0
    max: 0
    arm: 'both'
  - name: no-plan-task
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plan-task"'
    min: 0
    max: 0
    arm: 'both'
  - name: no-agent-call
    type: tool_used
    tool: 'Agent'
    min: 0
    max: 0
    arm: 'both'
  - name: no-task-call
    type: tool_used
    tool: 'Task'
    min: 0
    max: 0
    arm: 'both'
  - name: renamed
    type: regex
    pattern: '\bx\b'
    match: 'not_contains'
    target:
      source: file
      path: src/counter.js
