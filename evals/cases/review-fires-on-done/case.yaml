schema_version: "1.1"
name: review-fires-on-done
description: >-
  "I'm done, does it look right?" is the review skill's trigger. Finding: IN-19.
tags: [gate, trigger]
plugins: ["../../.under-test/plugin", "../../harness"]
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: |
    I'm done with this change. Does it look right?
context:
  scaffold_script: scaffold.sh
graders:
  - name: fires-review
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?review"'
