schema_version: "1.1"
name: docs-answer-no-verify
description: >-
  Answering a question about a doc edits nothing: no verify-change, no review. Finding: IN-19.
tags: [gate, no-trigger]
plugins: ["../../.under-test/plugin", "../../harness"]
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    What install command does the README give?
context:
  scaffold_script: scaffold.sh
graders:
  - name: no-verify-change
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?verify-change"'
    min: 0
    max: 0
    arm: 'both'
  - name: no-review
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?review"'
    min: 0
    max: 0
    arm: 'both'
  - name: answer
    type: regex
    pattern: 'make install'
