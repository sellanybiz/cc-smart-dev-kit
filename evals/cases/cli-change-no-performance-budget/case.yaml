schema_version: "1.1"
name: cli-change-no-performance-budget
description: >-
  A flag on a command-line script is not a frontend change. Finding: IN-23.
tags: [watch, no-trigger]
plugins: ["../../under-test/plugin", "../../harness"]
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill, Edit]
  prompt: |
    Add a --verbose flag to cli.js that prints each step it takes.
context:
  scaffold_script: scaffold.sh
graders:
  - name: no-performance-budget
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?performance-budget"'
    min: 0
    max: 0
    arm: 'both'
  - name: edited
    type: tool_used
    tool: 'Edit'
    input_match: 'cli\.js'
