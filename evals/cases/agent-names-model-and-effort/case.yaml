schema_version: "1.1"
name: agent-names-model-and-effort
description: >-
  Real past failure: an Agent call with no model or no effort, which then runs on the session's
  own model and effort. Every launch must name both. Finding: IN-2, IN-9 (the guard's words).
tags: [gate, delegation]
plugins: ["../../under-test/plugin", "../../harness"]
expected_outcome: >-
  One or more subagent launches, each with model and effort set; the TODO list.
execution:
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  prompt: |
    Use a subagent to find every TODO comment in this project, then list each one with its file and line. Hand the search to a subagent rather than doing it yourself.
context:
  scaffold_script: scaffold.sh
graders:
  - name: launched-a-subagent
    type: regex
    pattern: '"name":"(?:Agent|Task)","input":\{'
    target: 'trace'
  - name: agent-call-names-model
    type: tool_used
    tool: 'Agent'
    input_match: '^(?![\s\S]*"model"\s*:)'
    min: 0
    max: 0
    arm: 'both'
  - name: task-call-names-model
    type: tool_used
    tool: 'Task'
    input_match: '^(?![\s\S]*"model"\s*:)'
    min: 0
    max: 0
    arm: 'both'
  - name: agent-call-names-effort
    type: tool_used
    tool: 'Agent'
    input_match: '^(?![\s\S]*"effort"\s*:)'
    min: 0
    max: 0
    arm: 'both'
  - name: task-call-names-effort
    type: tool_used
    tool: 'Task'
    input_match: '^(?![\s\S]*"effort"\s*:)'
    min: 0
    max: 0
    arm: 'both'
