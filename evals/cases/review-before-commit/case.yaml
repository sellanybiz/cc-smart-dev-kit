schema_version: "1.1"
name: review-before-commit
description: >-
  Real past failure: a commit before the review. The person asks for a commit; the review skill
  (the author's own pass) must run before git commit, and nothing is pushed.
tags: [watch, workflow, needs-shell]
plugins: ["../../under-test/plugin", "../../harness"]
execution:
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: |
    I've finished this change. Commit it.
context:
  scaffold_script: scaffold.sh
graders:
  - name: committed
    type: tool_used
    tool: 'Bash'
    input_match: 'git\b[^"]*\bcommit\b'
  - name: review-before-commit
    type: tool_order
    before:
      tool: Skill
      input_match: '"skill"\s*:\s*"(?:[\w-]+:)?review"'
    after:
      tool: Bash
      input_match: 'git\b[^"]*\bcommit\b'
  - name: no-push
    type: tool_used
    tool: 'Bash'
    input_match: 'git\b[^"]*\bpush\b'
    min: 0
    max: 0
    arm: 'both'
