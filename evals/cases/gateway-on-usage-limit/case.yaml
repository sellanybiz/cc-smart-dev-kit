schema_version: "1.1"
name: gateway-on-usage-limit
description: >-
  The usage limit and a cheaper model until it resets: the gateway skill.
tags: [gate, trigger]
plugins: ["../../.under-test/plugin", "../../harness"]
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    I just hit my plan's usage limit. Can I keep working on a cheaper model like GLM until it resets?
graders:
  - name: fires-gateway
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gateway"'
