schema_version: "1.1"
name: one-file-fix-no-worker
description: >-
  A project with workers on, and a one-line fix in one file: it stays inline. No worker
  session, no lead skill, no subagent — a worker's start and review cost far more than the fix.
tags: [watch, no-trigger, needs-shell]
plugins: ["../../.under-test/plugin", "../../harness"]
execution:
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Agent, Edit]
  prompt: |
    range(1, 3) in src/range.js returns [1, 2] but should return [1, 2, 3]. Fix it.
context:
  scaffold_script: scaffold.sh
graders:
  - name: edited-range
    type: tool_used
    tool: 'Edit'
    input_match: '"file_path"\s*:\s*"[^"]*src/range\.js"'
  - name: no-worker-start
    type: tool_used
    tool: 'Bash'
    input_match: '\bworker\s+(?:start|lead)\b'
    min: 0
    max: 0
    arm: 'both'
  - name: no-lead-skill
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?lead"'
    min: 0
    max: 0
    arm: 'both'
  - name: no-agent-call
    type: tool_used
    tool: 'Agent'
    min: 0
    max: 0
    arm: 'both'
