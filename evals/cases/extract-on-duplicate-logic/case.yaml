schema_version: "1.1"
name: extract-on-duplicate-logic
description: >-
  The same logic in two files: extract-or-duplicate decides where it lives.
tags: [watch, trigger]
plugins: ["../../under-test/plugin", "../../harness"]
execution:
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    src/cart.js and src/invoice.js format prices the same way. Where should that logic live?
context:
  scaffold_script: scaffold.sh
graders:
  - name: fires-extract-or-duplicate
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?extract-or-duplicate"'
