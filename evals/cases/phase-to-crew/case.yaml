schema_version: "1.1"
name: phase-to-crew
description: >-
  A project with crew sessions on, and an approved plan whose two phases are each about an hour of
  work with their own files: each phase goes to a crew session through `crew start` (the
  lead skill), not to a subagent and not built inline. In the eval sandbox the command cannot
  start a real session (no home folder, no network, no registered lead), so the case grades the
  attempt.
tags: [watch, workflow, needs-shell]
plugins: ["../../.under-test/plugin", "../../harness"]
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Agent, Edit, Write]
  prompt: |
    The plan in .claude/plans/2026-01-01-lookup.md is approved. Start building it.
context:
  scaffold_script: scaffold.sh
graders:
  - name: fires-lead
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?lead"'
  - name: runs-crew-start
    type: tool_used
    tool: 'Bash'
    input_match: '\bcrew\s+start\b'
  - name: no-inline-build
    type: tool_used
    tool: 'Edit'
    input_match: '"file_path"\s*:\s*"[^"]*/src/'
    min: 0
    max: 0
    arm: 'both'
