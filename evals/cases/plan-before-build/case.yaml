schema_version: "1.1"
name: plan-before-build
description: >-
  Real past failure: building before the plan was approved. An unsettled design across several
  files must go through plan-task, and no code is written in this turn: only a plan file, then
  the question. Finding: IN-4, IN-20, MD-9.
tags: [watch, workflow, trigger]
plugins: ["../../under-test/plugin", "../../harness"]
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write, AskUserQuestion, Bash]
  prompt: |
    Add user accounts with sign-up and login to this app. I'm not sure whether sessions or JWTs fit better here, so pick the right one.
context:
  scaffold_script: scaffold.sh
graders:
  - name: fires-plan-task
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plan-task"'
  - name: no-code-edit
    type: tool_used
    tool: 'Edit'
    input_match: '"file_path"\s*:\s*"(?![^"]*/plans/)'
    min: 0
    max: 0
    arm: 'both'
  - name: no-code-write
    type: tool_used
    tool: 'Write'
    input_match: '"file_path"\s*:\s*"(?![^"]*/plans/)'
    min: 0
    max: 0
    arm: 'both'
