schema_version: "1.1"
name: pull-request-on-open-pr
description: >-
  Before every pull request, the pull-request skill says what its body carries.
tags: [watch, trigger]
plugins: ["../../under-test/plugin", "../../harness"]
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: |
    Open a pull request for this branch.
context:
  scaffold_script: scaffold.sh
graders:
  - name: fires-pull-request
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?pull-request"'
