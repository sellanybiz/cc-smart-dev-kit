schema_version: "1.1"
name: code-structure-on-mixed-function
description: >-
  A function with several jobs: code-structure decides how to split and name them.
tags: [watch, trigger]
plugins: ["../../under-test/plugin", "../../harness"]
execution:
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    This function parses, validates and saves an order. Should it be split, and what should the parts be called?
context:
  scaffold_script: scaffold.sh
graders:
  - name: fires-code-structure
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?code-structure"'
