schema_version: "1.1"
name: typo-fix-stays-small
description: >-
  A one-word fix needs no plan and no subagent. Finding: IN-12, IN-20.
tags: [gate, no-trigger]
plugins: ["../../under-test/plugin", "../../harness"]
execution:
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Agent]
  prompt: |
    Fix the typo "recieve" in README.md.
context:
  scaffold_script: scaffold.sh
graders:
  - name: no-plan-task
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plan-task"'
    min: 0
    max: 0
    arm: 'both'
  - name: no-agent-call
    type: tool_used
    tool: 'Agent'
    min: 0
    max: 0
    arm: 'both'
  - name: no-task-call
    type: tool_used
    tool: 'Task'
    min: 0
    max: 0
    arm: 'both'
  - name: fixed
    type: regex
    pattern: 'recieve'
    match: 'not_contains'
    target:
      source: file
      path: README.md
