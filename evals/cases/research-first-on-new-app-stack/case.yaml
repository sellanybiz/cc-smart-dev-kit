schema_version: "1.1"
name: research-first-on-new-app-stack
description: >-
  Starting a new app means choosing its stack: the data fetching, the app state, the HTTP
  client. That choice is research-first's job, not a library picked from memory.
tags: [watch, trigger, research]
plugins: ["../../under-test/plugin", "../../harness"]
execution:
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    We are starting the frontend of a new team task-tracking web app in this folder; it talks to a REST API. Pick the libraries for state management, data fetching and HTTP calls, and say why.
context:
  scaffold_script: scaffold.sh
graders:
  - name: fires-research-first
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?research-first"'
